# Default profile — via-IR everywhere: QuiverHook's inlined on-chain art library blows the
# legacy pipeline's stack ("value0 too deep"), so via-IR is mandatory for our code. Moderate
# optimizer runs keep QuiverHook inside EIP-170 (22,336 bytes runtime at 800 runs).
# The e2e suite is excluded here because it pulls in v4-core's Pool.sol, which solc 0.8.26
# only compiles under via-IR at upstream's extreme optimizer-runs value — see [profile.e2e].
[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 800
via_ir = true
ffi = false
skip = ["test/e2e/**"]
fs_permissions = [{ access = "read", path = "./" }]
# See src/vendor/PositionManagerArtifact.sol — Uniswap's PositionManager only fits EIP-170 at the
# 500 optimizer runs upstream pins it to, and a pinned file may only be imported by files pinned the
# same way. Repeated in every profile that compiles src/, because Forge does not inherit these.
additional_compiler_profiles = [
  { name = "posm", via_ir = true, optimizer_runs = 500 },
]
compilation_restrictions = [
  { paths = "lib/v4-periphery/src/PositionManager.sol", optimizer_runs = 500 },
  { paths = "src/vendor/PositionManagerArtifact.sol", optimizer_runs = 500 },
]

[profile.default.fuzz]
runs = 256

# E2E/fork profile — mirrors upstream v4-core's own settings (via-IR + 44444444 runs is the
# combination Uniswap ships and tests Pool.sol with; legacy codegen is not an option for us
# because QuiverHook requires via-IR). Contract size is irrelevant here — tests place code
# with vm.etch. Separate out dir so artifacts never mix with deploy artifacts.
# Run with:  FOUNDRY_PROFILE=e2e forge test --match-path "test/e2e/**" -vv
[profile.e2e]
src = "src"
out = "out-e2e"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 800
via_ir = true
ffi = false
gas_limit = "3000000000"
# Clear the skip inherited from [profile.default] so test/e2e IS compiled here — except the one
# test that deploys its own PoolManager, which needs [profile.v4local]'s optimizer runs to compile
# Pool.sol's swap path at all.
skip = ["test/e2e/ArcSelfHostedPosm.t.sol"]
fs_permissions = [{ access = "read", path = "./" }]
# Uniswap's periphery does NOT fit EIP-170 at a normal optimizer setting, and upstream's own
# foundry.toml is where the answer is: they pin PositionManager to 500 runs and PositionDescriptor to
# 1, per file. Compiled at this profile's 800, the descriptor comes out 26,069 bytes and the deploy
# is rejected on-chain. Mirroring their restrictions is what makes `DeployPositionManager` produce a
# deployable contract; do not "simplify" these away.
additional_compiler_profiles = [
  { name = "posm", via_ir = true, optimizer_runs = 500 },
]
compilation_restrictions = [
  { paths = "lib/v4-periphery/src/PositionManager.sol", optimizer_runs = 500 },
  { paths = "src/vendor/PositionManagerArtifact.sol", optimizer_runs = 500 },
]

[profile.e2e.fuzz]
runs = 256

# Local-v4 profile — for the one test that DEPLOYS a v4 PoolManager instead of pointing at a real
# one on a fork (test/e2e/ArcSelfHostedPosm.t.sol, which proves Coil can launch on a chain whose
# only v4 contract is the PoolManager). `new PoolManager(...)` forces solc to actually compile
# Pool.sol's swap path, and under via-IR that path only fits the stack at upstream v4-core's own
# optimizer_runs — at this project's 800 it fails with "memPtr_1 is 1 too deep". Kept as its own
# profile because 44444444 runs is slow and changes our contracts' sizes, neither of which should
# leak into the normal suites. Run with:
#   FOUNDRY_PROFILE=v4local forge test --match-contract ArcSelfHostedPosmTest -vv
[profile.v4local]
src = "src"
out = "out-v4local"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 44444444
via_ir = true
ffi = false
gas_limit = "3000000000"
skip = []
fs_permissions = [{ access = "read", path = "./" }]
# Same per-file pins as [profile.e2e], so the test deploys the SAME periphery bytecode the deploy
# script will. Without them the test would happily mint through a 27 KB PositionManager that could
# never exist on-chain, which is the opposite of what the test is for.
additional_compiler_profiles = [
  { name = "posm", via_ir = true, optimizer_runs = 500 },
]
compilation_restrictions = [
  { paths = "lib/v4-periphery/src/PositionManager.sol", optimizer_runs = 500 },
  { paths = "src/vendor/PositionManagerArtifact.sol", optimizer_runs = 500 },
]

[profile.v4local.fuzz]
runs = 64

# Sandbox profile — used where only the solc-js WASM compiler is reachable (no native solc).
# solc-js cannot compile the very large e2e compilation unit, so it is skipped here; the
# lightweight mock-based unit suite gives full logic coverage. Run with:
#   FOUNDRY_PROFILE=sandbox forge test --use ./solc-wrapper.js
[profile.sandbox]
src = "src"
out = "out"
libs = ["lib"]
evm_version = "cancun"
optimizer = false
via_ir = false
ffi = false
# CoilLaunchpad embeds `new CoilHook{salt}(...)` in a large function; the legacy pipeline goes
# stack-too-deep on it (it needs via-IR), so it is skipped in this no-via-IR profile. Its logic is
# covered by CoilLaunchpadUnit under the default (via-IR) profile: `forge test --use ./solc-wrapper.js`.
skip = [
  "test/e2e/**",
  "src/CoilLaunchpad.sol",
  "test/CoilLaunchpadUnit.t.sol",
  # Uniswap's PositionManager needs via-IR; this profile has none. It is only ever needed to produce
  # a deploy artifact, which is not what a WASM-compiler fallback is for.
  "src/vendor/**",
]
fs_permissions = [{ access = "read", path = "./" }]

[profile.sandbox.fuzz]
runs = 64

[fmt]
line_length = 110
tab_width = 4
int_types = "long"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
