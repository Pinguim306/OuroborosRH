<!doctype html>
<!--
  Source for public/og.png — the Open Graph / X share card.

  Rendered at 1200x630 CSS pixels with deviceScaleFactor 2 (so the PNG is 2400x1260), e.g.:

    npx playwright screenshot --viewport-size=1200,630 --scale=css \
      design/og-card.html public/og.png

  Kept as source rather than a bare PNG so the card can be re-cut when the copy or the palette
  changes. Colours here must match lib/palette.ts; the mark is the Logo component's path verbatim.
-->

<html>
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1200px; height:630px; overflow:hidden; }
  .card {
    position:relative; width:1200px; height:630px;
    background:
      radial-gradient(900px 560px at 88% -12%, rgba(139,92,255,0.20), transparent 62%),
      radial-gradient(700px 420px at -6% 4%, rgba(55,232,255,0.10), transparent 58%),
      #05060d;
    font-family:'Inter', system-ui, sans-serif;
    overflow:hidden;
  }
  /* faint engineering grid, same token as bg-grid-faint */
  .grid {
    position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,0.022) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.022) 1px, transparent 1px);
    background-size:48px 48px;
    mask-image: radial-gradient(700px 420px at 30% 50%, #000 20%, transparent 78%);
    -webkit-mask-image: radial-gradient(700px 420px at 30% 50%, #000 20%, transparent 78%);
  }
  .inner { position:relative; padding:66px 72px; height:100%; display:flex; flex-direction:column; justify-content:center; }
  .brand { position:absolute; top:60px; left:72px; display:flex; align-items:center; gap:14px; }
  .brand span {
    font-family:'Space Grotesk', system-ui, sans-serif; font-weight:700;
    font-size:34px; color:#e7eafc; letter-spacing:-0.02em;
  }
  h1 {
    margin-top:0;
    font-family:'Space Grotesk', system-ui, sans-serif; font-weight:700;
    font-size:74px; line-height:1.03; letter-spacing:-0.035em; color:#e7eafc;
    max-width:720px;
  }
  h1 .grad {
    background:linear-gradient(104deg,#cabfff 0%,#8b5cff 44%,#37e8ff 100%);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  }
  p.sub {
    margin-top:22px; max-width:640px;
    font-size:22px; line-height:1.5; color:#98a1c4; font-weight:400;
  }
  .facts { margin-top:42px; display:flex; gap:10px; }
  .chip {
    display:inline-flex; align-items:center; gap:9px;
    border:1px solid rgba(255,255,255,0.10); background:rgba(255,255,255,0.04);
    border-radius:999px; padding:9px 17px;
    font-size:16px; color:#c3cae8; font-weight:500;
  }
  .dot { width:7px; height:7px; border-radius:999px; background:#8b5cff; }
  .dot.cy { background:#37e8ff; }
  .art { position:absolute; right:-96px; top:50%; transform:translateY(-52%); opacity:0.62; }
  .url {
    position:absolute; right:72px; bottom:60px;
    font-size:19px; color:#79829f; letter-spacing:0.01em;
  }
</style>
</head>
<body>
<div class="card">
  <div class="grid"></div>

  <!-- The coil: same construction as the product mark (an outward spiral ending in a spark),
       scaled up as ambient artwork. The mark itself is untouched. -->
  <svg class="art" width="470" height="470" viewBox="0 0 48 48" fill="none">
    <defs>
      <linearGradient id="coil" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
        <stop stop-color="#b7a6ff"/><stop offset="0.5" stop-color="#8b5cff"/><stop offset="1" stop-color="#37e8ff"/>
      </linearGradient>
      <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0" stop-color="#8b5cff" stop-opacity="0.30"/>
        <stop offset="1" stop-color="#8b5cff" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <circle cx="24" cy="24" r="19" fill="url(#halo)"/>
    <path d="M24 24 C 25.6 24, 26.4 22.2, 25.4 20.9 C 23.9 18.8, 20.5 19.6, 19.9 22.3 C 19.0 26.2, 22.4 29.6, 26.4 29.3 C 31.8 28.9, 35 23.7, 33.8 18.4 C 32.3 11.6, 24.9 8.0, 18.4 10.5 C 10.5 13.5, 7 22.4, 10.4 30"
      stroke="url(#coil)" stroke-width="1.7" stroke-linecap="round" fill="none"/>
    <circle cx="10.4" cy="30" r="1.3" fill="#37e8ff"/>
    <circle cx="24" cy="24" r="0.8" fill="#b7a6ff"/>
  </svg>

  <div class="inner">
    <div class="brand">
      <svg width="40" height="40" viewBox="0 0 48 48" fill="none">
        <defs>
          <linearGradient id="m" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
            <stop stop-color="#b7a6ff"/><stop offset="0.5" stop-color="#8b5cff"/><stop offset="1" stop-color="#37e8ff"/>
          </linearGradient>
        </defs>
        <path d="M24 24 C 25.6 24, 26.4 22.2, 25.4 20.9 C 23.9 18.8, 20.5 19.6, 19.9 22.3 C 19.0 26.2, 22.4 29.6, 26.4 29.3 C 31.8 28.9, 35 23.7, 33.8 18.4 C 32.3 11.6, 24.9 8.0, 18.4 10.5 C 10.5 13.5, 7 22.4, 10.4 30"
          stroke="url(#m)" stroke-width="4" stroke-linecap="round"/>
        <circle cx="10.4" cy="30" r="2.6" fill="#37e8ff"/>
        <circle cx="24" cy="24" r="1.7" fill="#b7a6ff"/>
      </svg>
      <span>Coil</span>
    </div>

    <h1>Every trade<br/><span class="grad">winds the coil.</span></h1>
    <p class="sub">Launch straight into a live Uniswap&nbsp;v4 pool. Liquidity locked forever, and every swap pays holders.</p>

    <div class="facts">
      <span class="chip"><span class="dot"></span>Liquidity locked forever</span>
      <span class="chip"><span class="dot cy"></span>Holders earn every swap</span>
      <span class="chip"><span class="dot"></span>No staking</span>
    </div>
  </div>

  <div class="url">coil.trading</div>
</div>
</body>
</html>
